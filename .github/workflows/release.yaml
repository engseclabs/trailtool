name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Publishes ingestor/template.yaml to the Serverless Application Repository so
  # consumers can nest it with AWS::Serverless::Application. Skipped unless the
  # SAR_* repository variables are set, so tags release the CLI without it.
  serverless-app-repo:
    needs: goreleaser
    runs-on: ubuntu-latest
    if: ${{ vars.SAR_S3_BUCKET != '' && vars.SAR_PUBLISH_ROLE_ARN != '' }}
    permissions:
      contents: read
      id-token: write # assumes SAR_PUBLISH_ROLE_ARN
    env:
      SAR_APP_NAME: trailtool-ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ingestor/go.mod
          cache-dependency-path: ingestor/go.sum

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SAR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.SAR_REGION || 'us-east-1' }}

      - name: Build ingestor Lambda
        working-directory: ingestor
        run: make build

      - name: Publish application version
        working-directory: ingestor
        env:
          SAR_S3_BUCKET: ${{ vars.SAR_S3_BUCKET }}
        run: |
          set -euo pipefail
          # SAR semantic versions carry no leading 'v'.
          VERSION="${GITHUB_REF_NAME#v}"
          sam package \
            --template-file template.yaml \
            --s3-bucket "$SAR_S3_BUCKET" \
            --s3-prefix "$SAR_APP_NAME/$VERSION" \
            --output-template-file bin/packaged.yaml
          sam publish --template bin/packaged.yaml --semantic-version "$VERSION"

      - name: Grant public deploy access
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          APP_ID="arn:aws:serverlessrepo:${AWS_REGION}:${ACCOUNT_ID}:applications/${SAR_APP_NAME}"
          # Principals='*' is what makes the application publicly listed.
          aws serverlessrepo put-application-policy \
            --application-id "$APP_ID" \
            --statements Principals='*',Actions=Deploy
          echo "Published $APP_ID"
