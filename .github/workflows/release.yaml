name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Publishes trailtool-ingestor and trailtool-cloudtrail-forwarder to the
  # Serverless Application Repository at the tag's version. Skipped unless the
  # SAR_* repository variables are set, so tags release the CLI without it.
  serverless-app-repo:
    needs: goreleaser
    runs-on: ubuntu-latest
    if: ${{ vars.SAR_S3_BUCKET != '' && vars.SAR_PUBLISH_ROLE_ARN != '' }}
    permissions:
      contents: read
      id-token: write # assumes SAR_PUBLISH_ROLE_ARN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ingestor/go.mod
          cache-dependency-path: ingestor/go.sum

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SAR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.SAR_REGION || 'us-east-1' }}

      # Skips versions that already exist, so a partly failed run can be re-run.
      - name: Publish application versions
        working-directory: ingestor
        run: make publish-sar VERSION="${GITHUB_REF_NAME#v}" SAR_BUCKET="${{ vars.SAR_S3_BUCKET }}" SAR_REGION="$AWS_REGION"

      - name: Grant public deploy access
        working-directory: ingestor
        run: make sar-public SAR_REGION="$AWS_REGION"
