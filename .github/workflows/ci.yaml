name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Separate jobs so each module gets its own setup-go cache keyed on its own
  # go.sum; a shared job keyed on the root go.sum leaves ingestor un-restored.
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet -tags=vet ./...

      - name: Test
        run: go test -vet=off ./...

      - name: Build
        run: go build ./cmd/trailtool/

  ingestor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ingestor/go.mod
          cache-dependency-path: ingestor/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
